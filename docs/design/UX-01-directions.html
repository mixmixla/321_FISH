<header class="review"><div><strong>摸鱼助手 / 视觉方向</strong><br><small>UX-01 · 高保真设计原型 · 合成内容 · 非应用验收截图</small></div><div class="switch"><button id="a" class="active" onclick="direction('a')">A · 雾岸 / 推荐</button><button id="b" onclick="direction('b')">B · 纸间</button></div><div class="switch"><button id="chatBtn" class="active" onclick="page('chat')">聊天主窗</button><button id="lobbyBtn" onclick="page('lobby')">游戏大厅</button></div></header>
<div class="prototype" id="app"><div class="titlebar"><span>摸鱼助手 · 内部办公助手</span><span>—　 □　 ×</span></div><div class="shell"><nav class="rail"><div class="brand">m.</div><button id="navchat" class="on" onclick="page('chat')"><span data-icon="chat"></span>消息</button><button><span data-icon="sheet"></span>工作表</button><button id="navlobby" onclick="page('lobby')"><span data-icon="game"></span>桌游</button><button class="bottom"><span data-icon="settings"></span>设置</button><div class="avatar">林</div></nav><div class="workspace" id="workspace"></div></div></div>
<div class="note"><span id="rationale"><strong>A · 雾岸</strong>　柔和中性色、鼠尾草绿与清晰的三栏结构。办公与休闲共享轻量组件，适合 Tkinter 渐进实现。</span><span>原型预览 · 不连接服务器</span></div>
<template id="chat"><aside class="sidebar"><div class="section-title">消息 <button data-icon="plus"></button></div><div class="search"><span data-icon="search"></span><input placeholder="搜索会话或成员"></div><div class="eyebrow">置顶会话</div><div class="conversation selected"><div class="avatar">公</div><div><strong>公共聊天</strong><p>小周：午休来一局五子棋？</p></div><div class="meta">12:08</div></div><div class="conversation"><div class="avatar" style="background:#e6e7f0;color:#626485">设</div><div><strong>设计协作组</strong><p>新版界面已准备好</p></div><div class="meta">11:42</div></div><div class="eyebrow">最近会话</div><div class="conversation"><div class="avatar" style="background:#eee2d6;color:#9c7658">周</div><div><strong>小周<span class="badge">2</span></strong><p>下周计划我更新了</p></div><div class="meta">11:32</div></div><div class="conversation"><div class="avatar" style="background:#dfeaf1;color:#4e768e">陈</div><div><strong>陈同学</strong><p>好的，下午见</p></div></div><div class="conversation"><div class="avatar" style="background:#f1ede0;color:#857954" data-icon="bookmark"></div><div><strong>收藏夹</strong><p>只属于你的笔记空间</p></div></div></aside><section class="chat"><div class="chat-head"><div><h2>公共聊天</h2><div class="muted"><span class="online">● 已连接</span>　·　6 人在线</div></div><div class="tools"><button data-icon="search" title="搜索"></button><button data-icon="users" title="成员"></button><button data-icon="more" title="更多"></button></div></div><div class="messages" tabindex="0" aria-label="会话消息列表"><div class="date">今天 · 10月4日</div><div class="msg"><div class="avatar" style="background:#eee2d6;color:#9c7658">周</div><div><div class="name">小周　12:02</div><div class="bubble">上午的任务都处理好了，分享一下今天的计划。<div class="file"><span data-icon="file"></span><div><strong>项目进展.pdf</strong><br><span class="muted">248 KB · 点击下载</span></div></div></div></div></div><div class="msg self"><div class="avatar">林</div><div><div class="name">我　12:05</div><div class="bubble">收到。我把重点整理进工作表，下午一起看。</div><div class="read">已送达 ✓</div></div></div><div class=" <template id="lobby"><main class="lobby"><div class="lobby-head"><div><div class="eyebrow">TAKE A LITTLE BREAK</div><h1>一起，休息一会儿。</h1><div class="intro">找一位同事，从熟悉的棋局开始。</div></div><div class="search"><span data-icon="search"></span><input placeholder="搜索游戏"></div></div><div class="filters"><button class="chip chosen">精选棋类</button><button class="chip">全部游戏</button><button class="chip">2 人</button><button class="chip">本端可操作</button></div><div class="lobby-grid"><div class="games"><article class="game"><div class="cover"><span class="tag">策略 · 双人</span><div class="gomoku" id="stones"></div></div><div class="game-body"><h3>五子棋</h3><p>一子一步，先连成五子的获胜。</p><div class="game-bottom"><span class="status">实验 · 待完整验收</span><button class="primary">创建房间</button></div></div></article><article class="game"><div class="cover c4"><span class="tag">轻策略 · 双人</span><div class="connect4" id="discs"></div></div><div class="game-body"><h3>四子棋</h3><p>选择一列落子，率先连成四枚。</p><div class="game-bottom"><span class="status">实验 · 待完整验收</span><button class="primary">创建房间</button></div></div></article></div><aside class="rooms"><h3>正在等你 <span class="muted">2</span></h3><div class="room"><strong>小周的五子棋</strong><p>1 / 2 人　·　等待加入</p><button class="textbtn">加入房间　→</button></div><div class="room"><strong>午休四子棋</strong><p>2 / 2 人　·　对局中</p><button class="textbtn">进入观战　→</button></div><p class="muted" style="margin-top:28px">你的房间会留在这里。<br>收起窗口后也能继续。</p></aside><div class="catalogue"><div><strong>更多桌游，按实际支持状态查找</strong><p>实验 / 未验证 / 本端暂不支持均明确标记，保留全部 47 款目录。</p></div><button class="textbtn">浏览全部　→</button></div></div></main></template>
<script>

let view='chat';function icons(){document.querySelectorAll('[data-icon]').forEach(e=>e.innerHTML='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="'+paths[e.dataset.icon]+'"/></svg>')}
function direction(d){document.querySelector('#app').classList.toggle('ink',d==='b');document.querySelector('#a').classList.toggle('active',d==='a');document.querySelector('#b').classList.toggle('active',d==='b');document.querySelector('#rationale').innerHTML=d==='a'?'<strong>A · 雾岸</strong>　柔和中性色、鼠尾草绿与清晰的三栏结构。办公与休闲共享轻量组件，适合 Tkinter 渐进实现。':'<strong>B · 纸间</strong>　顶部导航、纸张暖白、深墨消息与编辑式卡片。更强的休闲辨识度，布局与绘制改造成本较高。'}
function page(p){view=p;document.querySelector('#workspace').innerHTML=document.querySelector('template#'+p).innerHTML;['chat','lobby'].forEach(v=>{document.querySelector('#'+v+'Btn').classList.toggle('active',v===p);document.querySelector('#nav'+v).classList.toggle('on',v===p)});icons();if(p==='lobby'){document.querySelector('#stones').innerHTML=[[1,2,0],[2,3,1],[2,2,0],[3,2,1],[3,3,0],[4,4,1],[3,4,0]].map(([x,y,w])=>'<i class="stone '+(w?'white':'')+'" style="left:'+(x*22-10)+'px;top:'+(y*22-10)+'px"></i>').join('');document.querySelector('#discs').innerHTML=Array.from({length:35},(_,i)=>'<i class="'+(i>20?(i%3?'red':'gold'):'')+'"></i>').join('')}}page('chat');
</script></html>
